<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IJOS · כל התואר. מקום אחד.</title>
<meta name="description" content="IJOS (Ido Joffe's OS): סביבת לימוד מקומית לסטודנטים. כל התואר. מקום אחד.">
<meta name="application-name" content="IJOS">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#17161e">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/app.css">
<script src="/vendor/katex/katex.min.js" defer></script>
<script type="module" src="/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">דילוג לתוכן</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="ניווט ראשי"></aside>
  <div class="main-col">
    <header class="topbar">
      <button type="button" class="icon-btn nav-toggle" id="nav-toggle" aria-label="תפריט" aria-controls="sidebar" aria-expanded="false">☰</button>
      <form class="search-form" id="search-form" role="search">
        <label class="sr-only" for="search-input">חיפוש</label>
        <input id="search-input" type="search" placeholder="חיפוש בכותרות, תגיות, הערות ותוכן נתמך… (Ctrl+K)" autocomplete="off" dir="auto">
      </form>
      <button type="button" class="btn btn-primary" id="capture-btn" title="Alt+N">+ הוספה מהירה</button>
      <span id="save-status" class="save-status" data-state="ok" role="status" aria-live="polite">הכול נשמר</span>
    </header>
    <div id="reminder-bar" class="reminder-bar" aria-live="polite"></div>
    <main id="main" tabindex="-1"><p class="loading">טוען…</p></main>
  </div>
</div>
<div id="toasts" class="toasts"></div>
<div id="drop-overlay" class="drop-overlay" hidden><div>שחררו כאן כדי לייבא קבצים</div></div>
</body>
</html>
